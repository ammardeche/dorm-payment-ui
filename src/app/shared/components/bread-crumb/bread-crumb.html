<nav aria-label="Breadcrumb">
  <ol class="flex flex-wrap items-center gap-2 text-sm">
    @for (item of items(); track $index; let last = $last) {
      <li class="flex items-center gap-2">
        @if ($index === 0) {
          <svg
            class="mr-1 size-4 shrink-0 text-slate-400"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            aria-hidden="true"
          >
            <path
              d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10Z"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        } @else {
          <span class="mx-1 select-none text-slate-300" aria-hidden="true">
            /
          </span>
        }

        @if (!last && item.url) {
          <a
            [routerLink]="item.url"
            class="rounded transition-colors hover:text-blue-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 text-slate-500"
          >
            {{ item.label }}
          </a>
        } @else {
          <span
            [attr.aria-current]="last ? 'page' : null"
            [class]="last ? 'font-medium text-slate-800' : 'text-slate-500'"
          >
            {{ item.label }}
          </span>
        }
      </li>
    }
  </ol>
</nav>
