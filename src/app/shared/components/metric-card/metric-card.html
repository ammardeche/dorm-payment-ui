<div
  class="flex h-full items-start gap-4 rounded-2xl border border-slate-200/80 bg-white p-5 shadow-sm"
>
  <!-- Icon supplied by the parent -->
  <div
    class="flex size-12 shrink-0 items-center justify-center rounded-xl"
    [class]="iconClasses()"
  >
    <ng-content select="[stat-icon]" />
  </div>

  <div class="min-w-0">
    <p class="text-sm font-medium text-slate-500">
      {{ label() }}
    </p>

    <p class="mt-2 break-words text-2xl font-semibold tracking-tight text-slate-900">
      {{ value() }}
    </p>

    @if (description()) {
      <p class="mt-1.5 text-xs leading-5 text-slate-500">
        {{ description() }}
      </p>
    }
  </div>
</div>
