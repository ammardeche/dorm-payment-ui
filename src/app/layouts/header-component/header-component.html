<header
  class="h-20 flex items-center justify-between px-8 bg-white/70 backdrop-blur-xl border-b border-gray-200/50"
>
  <!-- LEFT -->
<div class="min-w-0 flex-1">
  <app-bread-crumb class="block" />
</div>

  <!-- RIGHT -->
  <div class="flex items-center gap-4">
    <!-- 🌍 LANGUAGE SWITCH -->
    <div
      class="flex items-center bg-white/60 backdrop-blur-md rounded-xl p-1 border border-gray-200"
    >
      <button
        (click)="setLang('en')"
        [class.bg-black]="lang.currentLanguage() === 'en'"
        [class.text-white]="lang.currentLanguage() === 'en'"
        class="px-3 py-1 text-sm rounded-lg transition"
      >
        EN
      </button>

      <button
        (click)="setLang('pl')"
        [class.bg-black]="lang.currentLanguage() === 'pl'"
        [class.text-white]="lang.currentLanguage() === 'pl'"
        class="px-3 py-1 text-sm rounded-lg transition"
      >
        PL
      </button>
    </div>

    <!-- 🔔 NOTIFICATIONS -->
    <div
      class="relative w-10 h-10 flex items-center justify-center rounded-xl bg-white/60 backdrop-blur-md hover:bg-gray-100 cursor-pointer transition"
    >
      <svg width="18" height="20" viewBox="0 0 18 20" fill="none">
        <path
          d="M6.33309 18.0909C7.04076 18.6562 7.97528 19 8.99976 19C10.0242 19 10.9587 18.6562 11.6664 18.0909M1.50739 15.1818C1.08578 15.1818 0.850296 14.5194 1.10533 14.1514C1.69712 13.2975 2.26831 12.0451 2.26831 10.537L2.29272 8.35166C2.29272 4.29145 5.29556 1 8.99976 1C12.7585 1 15.8056 4.33993 15.8056 8.45995L15.7812 10.537C15.7812 12.0555 16.3327 13.3147 16.9004 14.169C17.1456 14.5379 16.9095 15.1818 16.4931 15.1818H1.50739Z"
          stroke="black"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>

      <span class="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full"></span>
    </div>

    <!-- 👤 USER -->
    <div class="flex items-center gap-3 pl-4 border-l border-gray-200 cursor-pointer">
      <img src="https://i.pravatar.cc/40" class="w-10 h-10 rounded-xl shadow-sm" />

      <div class="hidden sm:block leading-tight">
        <p class="text-sm font-semibold text-gray-800">Admin User</p>
        <p class="text-xs text-gray-400">Administrator</p>
      </div>
    </div>
  </div>
</header>
