<div class="relative">
  <div class="relative">
    <svg
      class="pointer-events-none absolute left-3.5 top-1/2 size-4 -translate-y-1/2 text-slate-400"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.7"
      aria-hidden="true"
    >
      <rect x="5" y="3" width="14" height="18" rx="2" />
      <path stroke-linecap="round" d="M9 21V7h6v14M12 12h.01" />
    </svg>

    <input
      type="text"
      aria-label="Search rooms"
      autocomplete="off"
      placeholder="All rooms"
      [value]="search()"
      (input)="onType($any($event.target).value)"
      (focus)="open.set(true)"
      (keydown.escape)="open.set(false)"
      class="h-11 w-full rounded-xl border border-slate-200 bg-slate-50/80 pl-10 pr-10 text-sm text-slate-900 outline-none transition duration-200 placeholder:text-slate-400 hover:border-slate-300 focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10"
    />

    <svg
      class="pointer-events-none absolute right-3.5 top-1/2 size-4 -translate-y-1/2 text-slate-400 transition-transform duration-200"
      [class.rotate-180]="open()"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      aria-hidden="true"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="m8 10 4 4 4-4" />
    </svg>
  </div>

  @if (open()) {
    <div
      class="absolute z-30 mt-2 w-full overflow-hidden rounded-xl border border-slate-200/80 bg-white p-1.5 shadow-xl shadow-slate-900/10"
    >
      <p class="px-3 pb-2 pt-1.5 text-[11px] font-medium uppercase tracking-wider text-slate-400">
        Select a room
      </p>

      <ul class="max-h-56 space-y-0.5 overflow-y-auto">
        <li>
          <button
            type="button"
            (click)="clearSelection()"
            class="flex w-full items-center rounded-lg px-3 py-2.5 text-left text-sm font-medium text-slate-600 outline-none transition hover:bg-slate-100 focus-visible:bg-blue-50 focus-visible:text-blue-700"
          >
            All rooms
          </button>
        </li>

        @for (room of filtered(); track room.id) {
          <li>
            <button
              type="button"
              (click)="select(room)"
              class="flex w-full items-center gap-2.5 rounded-lg px-3 py-2.5 text-left text-sm text-slate-700 outline-none transition hover:bg-blue-50 hover:text-blue-700 focus-visible:bg-blue-50 focus-visible:text-blue-700"
            >
              <span class="size-1.5 rounded-full bg-slate-300"></span>
              Room {{ room.roomNumber }}
            </button>
          </li>
        } @empty {
          <li class="px-3 py-5 text-center text-sm text-slate-400">
            No rooms found
          </li>
        }
      </ul>
    </div>
  }
</div>
