<article
  class="group rounded-2xl border border-slate-200 bg-white p-4
         shadow-sm transition duration-200
         hover:border-indigo-200 hover:shadow-md"
>
  <!-- Header -->
  <div class="flex items-center justify-between gap-3">
    <div>
      <h3 class="text-lg font-semibold tracking-tight text-slate-900">
        Room {{ room().roomNumber }}
      </h3>

      <p class="mt-0.5 text-xs text-slate-400">
        Floor {{ room().floorNumber }} · Double room
      </p>
    </div>

    <span
      class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1
             text-[11px] font-semibold"
      [class.bg-emerald-50]="room().currentOccupancy < 2"
      [class.text-emerald-700]="room().currentOccupancy < 2"
      [class.bg-rose-50]="room().currentOccupancy >= 2"
      [class.text-rose-600]="room().currentOccupancy >= 2"
    >
      <span class="h-1.5 w-1.5 rounded-full bg-current"></span>
      {{ room().currentOccupancy >= 2 ? 'Full' : 'Available' }}
    </span>
  </div>

  <!-- Compact bed tiles -->
  <div class="mt-4 grid grid-cols-2 gap-2.5">
    @for (bed of [1, 2]; track bed) {
      <div
        class="flex flex-col items-center rounded-xl border px-2 py-3"
        [class.border-rose-100]="room().currentOccupancy >= bed"
        [class.bg-rose-50]="room().currentOccupancy >= bed"
        [class.border-emerald-100]="room().currentOccupancy < bed"
        [class.bg-emerald-50]="room().currentOccupancy < bed"
      >
        <img
          class="h-24 w-20 object-contain transition-transform duration-200
                 group-hover:scale-105"
          [src]="
            room().currentOccupancy >= bed
              ? '/images/rooms/bed-occupied.png'
              : '/images/rooms/bed-available.png'
          "
          alt=""
          loading="lazy"
          decoding="async"
        />

        <span class="mt-2 text-xs font-semibold text-slate-700">
          Bed 0{{ bed }}
        </span>

        <span
          class="mt-1 inline-flex items-center gap-1 text-[11px] font-medium"
          [class.text-rose-600]="room().currentOccupancy >= bed"
          [class.text-emerald-700]="room().currentOccupancy < bed"
        >
          <span class="h-1 w-1 rounded-full bg-current"></span>
          {{ room().currentOccupancy >= bed ? 'Occupied' : 'Available' }}
        </span>
      </div>
    }
  </div>

  <!-- Footer -->
  <div
    class="mt-4 flex items-center justify-between gap-3
           border-t border-slate-100 pt-3"
  >
    <p class="text-xs text-slate-400">
      <span class="font-semibold text-slate-700">
        {{ room().currentOccupancy }}/2
      </span>
      occupied
    </p>

    <button
      type="button"
      class="inline-flex items-center gap-1.5 rounded-lg px-2.5 py-1.5
             text-xs font-semibold text-indigo-600 transition
             hover:bg-indigo-50 focus-visible:outline-2
             focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
      [attr.aria-label]="'View room ' + room().roomNumber"
    >
      Details

      <svg
        class="h-3.5 w-3.5"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M5 12h14m-6-6 6 6-6 6" />
      </svg>
    </button>
  </div>
</article>
