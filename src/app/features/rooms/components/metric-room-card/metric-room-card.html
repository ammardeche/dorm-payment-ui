<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4 my-6">
  @for (card of cards(); track card.id) {
    <article
      class="rounded-2xl border border-slate-200 bg-white p-5
             shadow-sm transition duration-200 hover:shadow-md"
    >
      <div class="flex items-center justify-between gap-3">
        <h3 class="text-sm font-medium text-slate-500">
          {{ card.label }}
        </h3>

        <span
          class="h-2.5 w-2.5 shrink-0 rounded-full"
          [class]="card.color"
          aria-hidden="true"
        ></span>
      </div>

      <p class="mt-5 text-3xl font-semibold tracking-tight text-slate-900">
        {{ card.value }}
      </p>

      <p class="mt-2 text-xs text-slate-400">
        {{ card.description }}
      </p>
    </article>
  }
</div>
