<div class="min-h-screen flex items-center justify-center px-6">
  <div class="text-center max-w-md">
    <!-- 404 Code -->
    <h1 class="text-8xl md:text-9xl font-extrabold text-sky-400 drop-shadow-lg">404</h1>

    <!-- Title -->
    <h2 class="mt-4 text-2xl md:text-3xl font-semibold text-black">Page Not Found</h2>

    <!-- Message -->
    <p class="mt-3 text-slate-800 leading-relaxed">
      The page you’re looking for doesn’t exist, was moved, or is temporarily unavailable.
    </p>

    <!-- Buttons -->
    <div class="mt-6 flex flex-col sm:flex-row gap-3 justify-center">
      <button
        [routerLink]="['/dashboard']"
        class="px-5 py-2 rounded-lg bg-sky-500 hover:bg-sky-600 text-white font-medium transition shadow-lg"
      >
        Go Home
      </button>
    </div>

    <!-- Decorative hint -->
    <p class="mt-8 text-xs text-slate-500">Error code: PAGE_NOT_FOUND</p>
  </div>
</div>
