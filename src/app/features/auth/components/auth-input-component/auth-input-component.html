<div>
  <label class="text-xs font-medium text-gray-600">{{ label() }}</label>

  <input
    [type]="type()"
    [formField]="field()"
    [placeholder]="placeholder()"
    class="w-full px-4 py-3 text-xs rounded-xl border border-gray-200 bg-white/70 focus:ring-2 focus:ring-blue-500 focus:outline-none"
  />

  @if (field()().touched() && field()().invalid()) {
    <div class="text-xs text-red-500 mt-2">
      @for (error of field()().errors(); track error) {
        <p>{{ error.message }}</p>
      }
    </div>
  }
</div>
