<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 mb-5 xl:grid-cols-4">
  @for (card of cards(); track card.id) {
    <article
      class="rounded-2xl border border-slate-200 bg-white p-5
             shadow-sm transition-shadow hover:shadow-md"
    >
      <div class="flex items-center gap-2">
        <span
          aria-hidden="true"
          class="h-2.5 w-2.5 animate-pulse rounded-full {{ card.color }}"
        ></span>

        <h3 class="text-sm font-medium text-slate-600">
          {{ card.label }}
        </h3>
      </div>

      <p class="mt-4 text-3xl font-semibold tracking-tight text-slate-900">
        {{ card.value ?? '—' }}
      </p>

      <p class="mt-2 text-xs text-slate-500">
        {{ card.description }}
      </p>
    </article>
  }
</div>
