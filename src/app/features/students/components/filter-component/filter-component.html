<section class="mb-6">
  <div class="mb-5">
    <h2 class="text-xl font-semibold text-slate-800">Student Filters</h2>

    <p class="mt-1 text-sm text-slate-500">Search students using one or more filters.</p>
  </div>

  <form [formRoot] = "studentFilterForm" class="grid grid-cols-1 gap-4 lg:grid-cols-12 lg:items-end">
    <!-- Student Number -->
    <div class="lg:col-span-4">
      <label for="studentNumber" class="mb-1 block text-sm font-medium text-slate-700">
        Student Number
      </label>

      <input
        id="studentNumber"
        type="text"
        placeholder="240137"
        [formField]="studentFilterForm.studentNumber"
        class="h-11 w-full rounded-md border border-slate-300 px-3 text-sm outline-none transition focus:border-indigo-500"
      />
    </div>

    <!-- Room -->

    <div class="lg:col-span-3">
  <label class="mb-1 block text-sm font-medium text-slate-700">Room</label>
  <app-room-select [rooms]="filterRooms()" (selectedRoom)="onRoomSelected($event)" />
</div>

    <!-- Status -->
    <div class="lg:col-span-3">
      <label for="isActive" class="mb-1 block text-sm font-medium text-slate-700"> Status </label>

      <select
        id="isActive"
        [formField]="studentFilterForm.isActive"
        class="h-11 w-full rounded-md border border-slate-300 px-3 text-sm outline-none transition focus:border-indigo-500"
      >
        <option value="all">All</option>
        <option value="true">Active</option>
        <option value="false">Inactive</option>
      </select>
    </div>

   
  </form>
</section>
