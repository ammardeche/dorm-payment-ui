<section class="mb-6 rounded-2xl border border-slate-200/80 bg-white p-5 shadow-sm sm:p-6">
  <!-- Header -->
  <div class="mb-5 flex items-start gap-3">
    <div class="flex size-10 shrink-0 items-center justify-center rounded-xl bg-slate-100">
      <svg
        class="size-5 text-slate-600"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M4 7h16M7 12h10M10 17h4"
        />
      </svg>
    </div>

    <div>
      <h2 class="text-base font-semibold tracking-tight text-slate-900">
        Filter students
      </h2>
      <p class="mt-1 text-sm text-slate-500">
        Find students by number, room, or status.
      </p>
    </div>
  </div>

  <form
    [formRoot]="studentFilterForm"
    class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-12 lg:items-end"
  >
    <!-- Student number -->
    <div class="lg:col-span-4">
      <label
        for="studentNumber"
        class="mb-2 block text-xs font-medium text-slate-600"
      >
        Student number
      </label>

      <div class="relative">
        <svg
          class="pointer-events-none absolute left-3.5 top-1/2 size-4 -translate-y-1/2 text-slate-400"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          aria-hidden="true"
        >
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path stroke-linecap="round" d="m16 16 4 4" />
        </svg>

        <input
          id="studentNumber"
          type="text"
          autocomplete="off"
          placeholder="Search student number..."
          [formField]="studentFilterForm.studentNumber"
          class="h-11 w-full rounded-xl border border-slate-200 bg-slate-50/80 pl-10 pr-3 text-sm text-slate-900 outline-none transition duration-200 placeholder:text-slate-400 hover:border-slate-300 focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10"
        />
      </div>
    </div>

    <!-- Room -->
    <div class="lg:col-span-3">
      <span class="mb-2 block text-xs font-medium text-slate-600">
        Room
      </span>

      <app-room-select-component
        [rooms]="filterRooms()"
        (selectedRoom)="onRoomSelected($event)"
      />
    </div>

    <!-- Status -->
    <div class="lg:col-span-3">
      <label
        for="isActive"
        class="mb-2 block text-xs font-medium text-slate-600"
      >
        Student status
      </label>

      <div class="relative">
        <select
          id="isActive"
          [formField]="studentFilterForm.isActive"
          class="h-11 w-full cursor-pointer appearance-none rounded-xl border border-slate-200 bg-slate-50/80 pl-3.5 pr-10 text-sm text-slate-900 outline-none transition duration-200 hover:border-slate-300 focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10"
        >
          <option value="all">All statuses</option>
          <option value="true">Active</option>
          <option value="false">Inactive</option>
        </select>

        <svg
          class="pointer-events-none absolute right-3.5 top-1/2 size-4 -translate-y-1/2 text-slate-400"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          aria-hidden="true"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="m8 10 4 4 4-4" />
        </svg>
      </div>
    </div>

    <!-- Reset -->
    <div class="lg:col-span-2">
      <button
        type="button"
        (click)="clear()"
        class="inline-flex h-11 w-full items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white px-4 text-sm font-medium text-slate-600 outline-none transition duration-200 hover:bg-slate-50 hover:text-slate-900 focus-visible:ring-4 focus-visible:ring-blue-500/10 active:bg-slate-100"
      >
        <svg
          class="size-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3 10a9 9 0 1 1 2.7 8.4M3 4v6h6"
          />
        </svg>

        Reset filters
      </button>
    </div>
  </form>
</section>
